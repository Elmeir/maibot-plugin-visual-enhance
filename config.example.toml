# 视觉增强（visual-enhance）配置模板
# 复制本文件为 config.toml（麦麦首次加载插件也会自动生成）；所有项都有默认值，一般无需修改。
# 说明：配置按用途分为多个页签（主页/帧合成/输出图像/动漫识别/图片重看/视频理解/调试），
#       本文件用 [段名] 对应；每个配置项的键、值与说明写在同一行，便于检索与对比关联配置。

[plugin]
enabled = true            # 插件总开关；关闭后 GIF 一律原样交给视觉模型
config_version = "1.1.0"  # 勿改

[merge]
process_image = true          # 处理普通图片组件（type=image）中的 GIF 动图；表情包组件（type=emoji）不处理——宿主表情链路原生支持 GIF 抽帧拼接分析，插件旁路会双倍解析并覆写其情绪标签格式
max_frames = 9                # 最多抽取的帧数（按时序均匀抽样，9 = 3x3 网格）；帧越多图越大、token 越贵
min_frames = 2                # 动画至少包含多少帧才触发合成；单帧 GIF 等价静态图，直接放行
draw_frame_index = true       # 在每帧左上角绘制序号（1、2、3…），帮助视觉模型理解播放顺序
storyboard_caption = true     # 在合成图顶部绘制说明条，引导视觉模型把网格图理解为一段动画（而非"九宫格拼图"）；环境中无中文字体时自动改用英文说明
clean_ghost_components = true # 识别完成后落库前恢复原图组件，防止合成图进入聊天记录/WebUI；多帧描述由后台搬运到原图名下，关闭后合成图随消息落库展示
adaptive_frames = true        # 按动画运动量自动调节实际抽帧数（最少~最多帧数间浮动）：静止/循环动画少抽省 token，运动丰富多抽保证证据；关闭则始终抽满最多帧数

[output]
output_format = "jpeg"    # 合成图格式：jpeg 体积小（推荐）；png 无损但明显更大
jpeg_quality = 85         # JPEG 质量 50~95（仅 jpeg 格式生效）
max_cell_size = 480       # 网格中每帧格子的最长边像素上限，帧原图更大时等比缩小
grid_gap = 4              # 帧与帧之间的白色间隔像素

[anime]
enabled = true                  # 动漫角色识别总开关：图片描述就绪后命中动漫关键词时，把图片送 AnimeTrace（ai.animedb.cn）识图，角色与作品名追加进图片描述；识图失败只记日志不影响消息链，已带识别标记的描述不会重复外发
process_gif = true              # GIF 动图也参与识别：随分镜描述搬运衔接识图（与静态图片开关相互独立）；关闭后 GIF 只做分镜合成
process_static = true           # 静态图片也参与识别：观察所有普通图片（type=image）的宿主识别描述，命中关键词即识图（静态动漫截图是识图主要场景）；关闭后只识别 GIF 分镜
keywords = "动漫,动画,番剧,二次元,漫画,卡通,插画,角色,anime,アニメ,動漫,動畫"  # 触发关键词（逗号/换行分隔，不区分大小写）：描述命中任一才外发识图，避免真人照片等无关图片外发；清空时回退默认表
api_url = "https://api.animetrace.com/v1/search"  # AnimeTrace 识图接口（ai.animedb.cn 页面对应的官方 API）；服务迁移域名时才改
model = ""                      # 识别模型 ID，留空=服务端默认（官方模型列表动态增减，不建议写死）
max_characters = 5              # 最多写入描述的人物数（多人画面按检测顺序取前 N 个）
max_candidates = 2              # 每个人物写入的候选数：接口只给按可能性排序的候选（无概率值），实测公会名等非角色条目可能排在首位（not_confident=false 也不标记），默认取前 2 个候选（用『或』连接）让正确角色在列；1=描述最简
smart_filter = true             # 智能筛选：一人多候选或总人数≥3 时只写角色名、省略《作品》控制描述长度；关闭则始终带作品名
filter_not_confident = true     # 过滤低置信结果：存在高置信检测框时跳过官方标记 not_confident 的低置信框（宁可缺判也不错判）；全部为低置信时兜底写入（带「（低置信）」标注）；关闭则始终写入低置信结果
cache_enabled = true            # 识别结果本地缓存：同一张图（按内容 hash）的结果落盘复用（数据目录 anime_recognition_cache.json，上限 2000 条），重启后不重复调接口；仅缓存成功结果
debug_mode = false              # 调试日志（动漫识别专用）：与「调试」页签的总开关任一开启即输出识别链路诊断信息；日常建议关闭
inject_enabled = false          # 阻塞注入（首次发送即见角色）：收到图片后在等待秒数内完成识图并把角色标签写入本轮消息，消息会阻塞等待（通常 1~3 秒）；默认关=识图在后台，同图下次出现时生效
inject_timeout_seconds = 6.0    # 注入等待秒数：识图（含 VLM 门控）超时即放行消息，转后台观察兜底
inject_wait_vlm = true          # 等待 VLM 门控：开=先调麦麦 VLM 生成描述，命中动漫关键词才外发识图（描述写入组件，宿主跳过重复识别）；关=直接识图（快，全部外发）
vlm_model = ""                  # VLM 具体模型名（可选）：门控默认用任务自身的模型选择策略；仅当日志报『未找到名为 xxx 的模型』时，填 model_config 的 [models] 里定义的模型名
timeout_seconds = 15.0          # 识图接口请求超时（秒）

[relook]
enabled = true            # 图片重看总开关：提供 inspect_image 工具（首遍描述不够时按问题重看图）
include_emoji = true      # 含表情包：开=表情包也能重看；关=只看普通图片
lookback_hours = 24       # 向前找图的时间窗（小时）；0 = 不限，按最近条数取
recent_message_limit = 40 # 拉取最近消息条数上限
max_images = 10           # 候选图片数量上限（image_index 在此范围内取值）
llm_task = "vlm"          # 识图用的宿主模型任务名（不是模型名；需 visual=true 的多模态任务）
vlm_model = ""            # 可选：具体模型名；留空按任务策略选择，仅当日志报「未找到名为 xxx 的模型」时填 model_config 的 [models] 里的模型名
temperature = 0.2         # 重看生成温度（越低越稳定）
max_tokens = 1024         # 重看回答最大 token

[parse]
enable_ai_summary = true  # 获取官方 AI 总结（B站需登录态；部分视频本身无总结）
enable_douyin = true      # 启用抖音视频解析（信息 / 章节要点 / AI 总结）
enable_in_group = true    # 群聊中检测到视频链接时，把总结附加到上下文（不主动回复）
enable_in_private = true  # 私聊中检测到视频链接时，把总结附加到上下文（不主动回复）
cache_ttl_seconds = 1800  # 视频信息缓存时长（秒）

[credential]
sessdata = ""             # B站 Cookie SESSDATA（AI 总结需要登录态；留空则只取视频基本信息）
bili_jct = ""             # B站 Cookie bili_jct（选填）
buvid3 = ""               # B站 Cookie buvid3（选填）
dedeuserid = ""           # B站 Cookie DedeUserID（选填）
douyin_cookie = ""        # 抖音 Cookie（选填）：整串文本 k=v; k2=v2（也支持 Netscape/cookies.txt 导出格式）；也可放数据目录 douyin_cookies.txt；不含 ttwid 时插件自动申请游客标识

[debug]
enabled = false           # 调试日志总开关：开=三块能力的诊断信息（解析/识图/凭据失败原因等）以 INFO 输出；日常保持关闭

